<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>내 웹앱</title>
<style>
  :root{
    --paper:#FBF7EF;
    --card:#FFFDF8;
    --ink:#221E1A;
    --ink-2:#5F574D;
    --ink-3:#8C8377;
    --line:#E8E0D2;
    --red:#E84A3A;
    --green:#2E7D32;
    --blue:#1E88E5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto}
  .dots{display:flex;gap:4px;margin-bottom:12px}
  .dots i{width:10px;height:10px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:var(--red)}
  .dots i:nth-child(2){background:var(--green)}
  .dots i:nth-child(3){background:var(--blue)}
  h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
  .sub{font-size:13px;color:var(--ink-3);margin:0 0 22px;letter-spacing:-.01em}
  .apps{display:grid;gap:14px}
  @media(min-width:560px){.apps{grid-template-columns:1fr 1fr}}
  a.app{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:14px;
    text-decoration:none;color:inherit;
    box-shadow:0 2px 10px rgba(70,52,24,.06);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  a.app:active{transform:scale(.985)}
  @media(hover:hover){a.app:hover{box-shadow:0 6px 20px rgba(70,52,24,.12)}}
  a.app img{
    width:76px;height:76px;border-radius:19px;flex:0 0 auto;
    border:1px solid rgba(34,30,26,.07);
    box-shadow:0 2px 6px rgba(70,52,24,.10);
  }
  .txt{min-width:0}
  .txt strong{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
  .txt span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.4;letter-spacing:-.01em}
  .arrow{margin-left:auto;color:var(--ink-3);font-size:20px;flex:0 0 auto;padding-left:4px}
  .how{
    margin-top:26px;padding:16px 18px;
    background:#FFF9EC;border:1px solid #F0E4CB;border-radius:18px;
    font-size:12.5px;color:var(--ink-2);line-height:1.65;letter-spacing:-.01em;
  }
  .how b{color:var(--ink)}
  .how ol{margin:6px 0 0;padding-left:18px}
  .how li{margin:2px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>내 웹앱</h1>
  <p class="sub">아이폰 홈 화면에 추가해서 앱처럼 쓰는 두 가지</p>

  <div class="apps">
    <a class="app" href="./color-score/">
      <img src="./color-score/apple-touch-icon.png" alt="" width="76" height="76">
      <div class="txt">
        <strong>색깔 가사 악보</strong>
        <span>화성에 색을 입히는 가사보</span>
      </div>
      <div class="arrow" aria-hidden="true">›</div>
    </a>

    <a class="app" href="./toddler-abc-hangul/">
      <img src="./toddler-abc-hangul/apple-touch-icon.png" alt="" width="76" height="76">
      <div class="txt">
        <strong>아기 첫 한글·알파벳</strong>
        <span>코끼리랑 말해요 — 말하기 놀이</span>
      </div>
      <div class="arrow" aria-hidden="true">›</div>
    </a>
  </div>

  <div class="how">
    <b>홈 화면에 추가하는 법 (아이폰)</b>
    <ol>
      <li>사파리로 이 페이지를 엽니다.</li>
      <li>아래쪽 <b>공유</b> 버튼을 누릅니다.</li>
      <li><b>홈 화면에 추가</b>를 선택합니다.</li>
    </ol>
  </div>
</div>
</body>
</html>
